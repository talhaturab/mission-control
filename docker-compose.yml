# The same four processes as `python -m app.dev`, each in its own container.
#   docker compose up --build --scale worker=2
services:
  web:
    build: .
    ports: ["8010:8000"]
    env_file: .env
    environment:
      TASK_NAME: web
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 5

  worker:
    build: .
    command: python -m app.worker
    env_file: .env
    environment:
      HUB_URL: http://web:8000      # containers reach each other by service name
    depends_on:
      web: { condition: service_healthy }

  ticker:
    build: .
    command: python -m app.ticker
    env_file: .env
    environment:
      HUB_URL: http://web:8000
      TASK_NAME: ticker
      TICK_FOREVER: "1"             # loop here; on ECS a schedule starts a fresh one each time
    depends_on:
      web: { condition: service_healthy }
