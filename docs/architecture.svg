<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="900" height="560" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker>
  <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker>
  <marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker>
  <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker></defs>
  <rect width="900" height="560" fill="#ffffff"/>
  <text x="20" y="28" font-size="15" font-weight="bold" fill="#111">Mission Control · step 6 · the agent moves to AgentCore</text>

  <!-- github -->
  <rect x="20" y="50" width="170" height="150" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-dasharray="6 5"/>
  <text x="36" y="72" fill="#15803d">GITHUB ACTIONS</text>
  <text x="105" y="94" text-anchor="middle" fill="#444" font-size="11">on every merge to main:</text>
  <rect x="36" y="102" width="138" height="22" rx="6" fill="#fff" stroke="#16a34a"/><text x="105" y="117" text-anchor="middle" font-size="11">test</text>
  <rect x="36" y="128" width="138" height="22" rx="6" fill="#fff" stroke="#16a34a"/><text x="105" y="143" text-anchor="middle" font-size="11">build, push to ECR</text>
  <rect x="36" y="154" width="138" height="22" rx="6" fill="#fff" stroke="#16a34a"/><text x="105" y="169" text-anchor="middle" font-size="11">cdk deploy</text>
  <text x="105" y="192" text-anchor="middle" fill="#15803d" font-size="10">signed in by OIDC, no key</text>

  <rect x="36" y="224" width="138" height="44" rx="8" fill="#fff" stroke="#333"/><text x="105" y="251" text-anchor="middle">browser</text>
  <path d="M174 246 L228 246 L228 222 L244 222" stroke="#2563eb" stroke-width="2" fill="none" marker-end="url(#b)"/><text x="105" y="286" text-anchor="middle" fill="#2563eb" font-size="11">https, to the load balancer</text>

  <!-- AWS -->
  <rect x="210" y="50" width="670" height="450" rx="14" fill="#fff8f0" stroke="#f59e0b" stroke-dasharray="6 5"/>
  <text x="226" y="72" fill="#92400e">AWS · LONDON · ECS CLUSTER "mission-control" · all of it created by the stack</text>
  <path d="M174 139 L228 118" stroke="#16a34a" stroke-width="1.5" marker-end="url(#g)"/>

  <!-- ECR + secret -->
  <rect x="230" y="90" width="150" height="46" rx="8" fill="#fff" stroke="#333"/><text x="305" y="110" text-anchor="middle" font-weight="bold">ECR</text><text x="305" y="128" text-anchor="middle" fill="#444" font-size="10">mission-control:&lt;commit&gt;</text>
  <rect x="400" y="90" width="170" height="46" rx="8" fill="#fff" stroke="#333"/><text x="485" y="110" text-anchor="middle" font-weight="bold">Secrets Manager</text><text x="485" y="128" text-anchor="middle" fill="#444" font-size="11">mission-control/openrouter</text>
  <text x="600" y="106" fill="#444" font-size="11">tasks pull the image and read</text><text x="600" y="122" fill="#444" font-size="11">the key at start, by IAM role</text>

  <!-- web express -->
  <rect x="230" y="160" width="340" height="150" rx="10" fill="#e8f0fe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="400" y="182" text-anchor="middle" font-weight="bold">web · ECS Express service</text>
  <rect x="246" y="196" width="140" height="44" rx="6" fill="#fff" stroke="#2563eb"/><text x="316" y="214" text-anchor="middle" font-size="12">load balancer</text><text x="316" y="230" text-anchor="middle" fill="#444" font-size="11">HTTPS · …on.aws</text>
  <rect x="404" y="196" width="150" height="44" rx="6" fill="#fff" stroke="#2563eb"/><text x="479" y="214" text-anchor="middle" font-size="12">Fargate task</text><text x="479" y="230" text-anchor="middle" fill="#444" font-size="10">dashboard · API · relay to agent</text>
  <path d="M386 218 L402 218" stroke="#2563eb" stroke-width="1.5" marker-end="url(#b)"/>
  <text x="400" y="266" text-anchor="middle" fill="#444" font-size="11">state: still in memory, in this one task</text>
  <text x="400" y="284" text-anchor="middle" fill="#444" font-size="11">scaling: 1 to 2 tasks · health check GET /health</text>

  <!-- workers -->
  <rect x="230" y="330" width="340" height="150" rx="10" fill="#fff7e6" stroke="#d97706" stroke-width="1.5"/>
  <text x="400" y="352" text-anchor="middle" font-weight="bold">worker · ECS service on Fargate</text>
  <rect x="246" y="366" width="90" height="40" rx="6" fill="#fff" stroke="#d97706"/><text x="291" y="390" text-anchor="middle" font-size="12">task</text>
  <rect x="346" y="366" width="90" height="40" rx="6" fill="#fff" stroke="#d97706"/><text x="391" y="390" text-anchor="middle" font-size="12">task</text>
  <rect x="446" y="366" width="90" height="40" rx="6" fill="#fff" stroke="#d97706" stroke-dasharray="4 3"/><text x="491" y="390" text-anchor="middle" font-size="12" fill="#888">task</text>
  <text x="400" y="430" text-anchor="middle" fill="#444" font-size="11">desired 2 · autoscaling: CPU near 50%, 1 to 4 tasks</text>
  <text x="400" y="448" text-anchor="middle" fill="#444" font-size="11">heartbeat, claim, do, report → the web URL</text>
  <path d="M400 330 L400 312" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- ticker -->
  <rect x="600" y="160" width="260" height="110" rx="10" fill="#f3e8ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="730" y="182" text-anchor="middle" font-weight="bold">ticker · scheduled task</text>
  <rect x="616" y="196" width="110" height="36" rx="6" fill="#fff" stroke="#7c3aed"/><text x="671" y="218" text-anchor="middle" font-size="11">EventBridge rule</text>
  <rect x="740" y="196" width="104" height="36" rx="6" fill="#fff" stroke="#7c3aed"/><text x="792" y="218" text-anchor="middle" font-size="11">Fargate task</text>
  <path d="M726 214 L738 214" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="730" y="256" text-anchor="middle" fill="#444" font-size="11">every 5 min: start, report, exit</text>
  <path d="M600 230 L572 222" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- agentcore -->
  <rect x="600" y="290" width="260" height="110" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="730" y="312" text-anchor="middle" font-weight="bold">agent · AgentCore</text>
  <rect x="616" y="324" width="110" height="36" rx="6" fill="#fff" stroke="#059669"/><text x="671" y="340" text-anchor="middle" font-size="11">Runtime</text><text x="671" y="353" text-anchor="middle" fill="#444" font-size="9">same image, arm64</text>
  <rect x="740" y="324" width="104" height="36" rx="6" fill="#fff" stroke="#059669"/><text x="792" y="340" text-anchor="middle" font-size="11">Gateway</text><text x="792" y="353" text-anchor="middle" fill="#444" font-size="9">MCP, IAM in front</text>
  <path d="M726 342 L738 342" stroke="#059669" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="730" y="384" text-anchor="middle" fill="#444" font-size="11">web calls it; it calls the hub over HTTP</text>
  <path d="M570 230 C 600 250, 600 300, 616 330" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#b)"/>

  <!-- internet -->
  <rect x="600" y="412" width="260" height="76" rx="10" fill="#fafafa" stroke="#c7cad6"/>
  <text x="616" y="432" fill="#666" font-size="11">THE INTERNET</text>
  <rect x="616" y="442" width="228" height="36" rx="6" fill="#fff" stroke="#333"/><text x="730" y="457" text-anchor="middle" font-size="10">OpenRouter · Wikipedia · web pages</text><text x="730" y="471" text-anchor="middle" fill="#444" font-size="9">DeepWiki MCP, behind the gateway</text>
  <path d="M792 360 L792 440" stroke="#059669" stroke-width="1.5" marker-end="url(#a)"/>
  <path d="M570 400 L614 450" stroke="#d97706" stroke-width="1.5" marker-end="url(#o)"/>
  <text x="20" y="526" fill="#666" font-size="11">the agent is its own process now: runtime hosts it, gateway guards its tools, its role reads the key · no key anywhere</text>
  <text x="20" y="544" fill="#666" font-size="11">Base stack by hand once · everything else, agent included, redeployed on every merge · done</text>
</svg>
